{% macro protected(permission) %}
    {% if can(permission) %}
        {{ caller() }}
    {% else %}
        <div class="position-relative d-inline-block w-100">
            <div style="filter: blur(2px) grayscale(50%); pointer-events: none; opacity: 0.6; border: 1px solid rgba(79, 70, 229, 0.2);">
                {{ caller() }}
            </div>
            
            <div class="position-absolute top-50 start-50 translate-middle text-center">
                <div style="background-color: #4f46e5; color: #ffffff; padding: 10px 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(79, 70, 229, 0.5); border: 1px solid rgba(255, 255, 255, 0.2);">
                    <i class="bi bi-lock-fill"></i>
                </div>
            </div>
        </div>
    {% endif %}
{% endmacro %}
