{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="p-5 shadow-sm" style="max-width: 450px; width: 100%; background: #ffffff; border: 2px solid #ddd6fe; border-radius: 24px; animation: fadeIn 0.6s ease-out;">
        
        <div class="text-center mb-4">
            <div style="width: 60px; height: 60px; background: #f5f3ff; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; border: 2px solid #c4b5fd;">
                <i class="bi bi-shield-lock" style="font-size: 1.5rem; color: #4338ca;"></i>
            </div>
            <h1 class="h4 fw-bold text-dark">Sécurisation du compte</h1>
            <p class="text-secondary small">Veuillez définir un nouveau mot de passe pour accéder au système.</p>
        </div>

        {% if erreur %}
        <div class="alert alert-danger border-0 text-center" style="background: #fef2f2; color: #ef4444; border-radius: 12px; font-size: 0.85rem;">{{ erreur }}</div>
        {% endif %}

        <form method="post" action="/changer-mdp">
            <div class="mb-3">
                <label class="small fw-bold text-uppercase text-secondary">Mot de passe actuel</label>
                <input type="password" name="ancien_mdp" class="form-control" style="border-radius: 12px; border: 2px solid #e5e7eb;" required>
            </div>
            <div class="mb-3">
                <label class="small fw-bold text-uppercase text-secondary">Nouveau mot de passe</label>
                <input type="password" name="nouveau_mdp" class="form-control" style="border-radius: 12px; border: 2px solid #e5e7eb;" required>
            </div>
            <div class="mb-4">
                <label class="small fw-bold text-uppercase text-secondary">Confirmation</label>
                <input type="password" name="confirmation_mdp" class="form-control" style="border-radius: 12px; border: 2px solid #e5e7eb;" required>
            </div>
            <button type="submit" class="btn w-100 fw-bold py-2" style="background-color: #4338ca; color: white; border-radius: 12px;">
                Valider la sécurisation
            </button>
        </form>
    </div>
</div>

<style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .form-control:focus { border-color: #8b5cf6 !important; box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1); }
</style>
{% endblock %}
