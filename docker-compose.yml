services:
  app:
    build: .
    volumes:
      - ./app/database.db:/app/app/database.db
    env_file:
      - .env
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: always